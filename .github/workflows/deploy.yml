name: Deploy to AWS

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy — todas as instâncias via SSM (ASG dinâmico)
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b  # v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Deploy via SSM em todas as instâncias do ASG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REGION="us-east-2"
          APP_DIR="/home/ubuntu/security-scanner"

          # Descobre dinamicamente todas as instâncias healthy do ASG
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --region "$REGION" \
            --query "AutoScalingGroups[].Instances[?HealthStatus=='Healthy'].InstanceId" \
            --output text | tr '\t' ' ')

          echo "Instâncias encontradas: $INSTANCE_IDS"

          if [ -z "$INSTANCE_IDS" ]; then
            echo "❌ Nenhuma instância encontrada no ASG"
            exit 1
          fi

          FAILED=0

          # Deploy sequencial para evitar downtime (rolling deploy)
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo ""
            echo "=== Deployando em $INSTANCE_ID ==="

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 180 \
              --parameters "commands=[\
                \"set -eu\",\
                \"export HOME=/root\",\
                \"if [ ! -d $APP_DIR ]; then echo 'SKIP - app nao instalado nesta instancia'; exit 0; fi\",\
                \"git config --global --add safe.directory $APP_DIR\",\
                \"cd $APP_DIR\",\
                \"git remote set-url origin 'https://x-access-token:${GH_TOKEN}@github.com/charles-rocha-code/s3_auditor_enteprise.git'\",\
                \"git fetch origin main\",\
                \"git reset --hard origin/main\",\
                \"git clean -fd\",\
                \"git remote set-url origin 'https://github.com/charles-rocha-code/s3_auditor_enteprise.git'\",\
                \"chown -R ubuntu:ubuntu $APP_DIR\",\
                \"sudo -u ubuntu $APP_DIR/venv/bin/pip install -r $APP_DIR/requirements.txt 2>&1 || { echo PIP_FAILED; exit 1; }\",\
                \"sudo sed -i 's|ExecStart=.*|ExecStart=/home/ubuntu/security-scanner/venv/bin/uvicorn api_with_mfa_fix:app --host 0.0.0.0 --port 8000|' /etc/systemd/system/security-scanner.service\",\
                \"sudo systemctl daemon-reload\",\
                \"sudo systemctl restart security-scanner || { journalctl -u security-scanner -n 50 --no-pager; exit 1; }\",\
                \"sleep 8\",\
                \"curl -sf http://127.0.0.1:8000/health && echo HEALTH_OK || { journalctl -u security-scanner -n 50 --no-pager; exit 7; }\"\
              ]" \
              --region "$REGION" \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            # Poll com timeout
            STATUS="Pending"
            for i in $(seq 1 24); do
              sleep 5
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "[${i}] $INSTANCE_ID — Status: $STATUS"

              case "$STATUS" in
                Success)
                  echo "✅ $INSTANCE_ID — deploy concluído"
                  break
                  ;;
                Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut)
                  echo "❌ $INSTANCE_ID — falhou (Status: $STATUS)"
                  echo "--- STDOUT ---"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$REGION" \
                    --query 'StandardOutputContent' \
                    --output text || true
                  echo "--- STDERR ---"
                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$REGION" \
                    --query 'StandardErrorContent' \
                    --output text || true
                  FAILED=1
                  break
                  ;;
              esac
            done

            [ "$STATUS" = "Success" ] || { echo "❌ Timeout em $INSTANCE_ID"; FAILED=1; }
          done

          [ $FAILED -eq 0 ] && echo "" && echo "✅ Deploy concluído em todas as instâncias" || exit 1
