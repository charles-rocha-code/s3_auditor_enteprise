<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>App Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0d1117;color:#e6edf3;font-family:'DM Sans',sans-serif}
body{padding:2rem 2rem 2.5rem;max-width:1100px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.07);flex-wrap:wrap;gap:.5rem}
.top-title{font-size:1.1rem;font-weight:500}
.top-sub{font-size:.72rem;color:#6e7681;margin-top:3px;font-family:'DM Mono',monospace}
.tags{display:flex;gap:.4rem;flex-wrap:wrap}
.tag{border:1px solid;border-radius:20px;padding:2px 9px;font-size:.67rem;font-family:'DM Mono',monospace}
.tg{background:rgba(63,185,80,.08);color:#3fb950;border-color:rgba(63,185,80,.22)}
.tb{background:rgba(88,166,255,.08);color:#58a6ff;border-color:rgba(88,166,255,.22)}
.tr{background:rgba(248,81,73,.08);color:#f85149;border-color:rgba(248,81,73,.22)}
.ta{background:rgba(227,179,65,.08);color:#e3b341;border-color:rgba(227,179,65,.22)}
.tp{background:rgba(163,113,247,.08);color:#a371f7;border-color:rgba(163,113,247,.22)}
.diagram{background:#161b22;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:1.5rem}
.diagram svg{display:block}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="top-title">Security Multicloud Scanner — Arquitetura da Aplicação</div>
    <div class="top-sub">FastAPI · Python 3.11 · MFA · Multicloud · Risk Engine · PDF/DOCX Reports</div>
  </div>
  <div class="tags">
    <span class="tag tg">FastAPI</span>
    <span class="tag tb">MFA/TOTP</span>
    <span class="tag tr">Risk Engine</span>
    <span class="tag ta">Multicloud</span>
    <span class="tag tp">K8s</span>
  </div>
</div>
<div class="diagram">
<svg viewBox="0 0 1040 700" width="1040" height="700" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- BROWSER -->
<rect x="380" y="10" width="280" height="52" rx="8" fill="rgba(139,148,158,.1)" stroke="rgba(139,148,158,.28)" stroke-width=".8"/>
<text x="520" y="30" text-anchor="middle" font-size="13" font-weight="500" fill="#e6edf3">Browser / API Client</text>
<text x="520" y="50" text-anchor="middle" font-size="10" fill="#8b949e" font-family="'DM Mono',monospace">dashboard · login · curl · SDK</text>

<!-- Arrow browser -> fastapi -->
<line x1="520" y1="62" x2="520" y2="92" stroke="#378ADD" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="527" y="80" font-size="9" fill="#6e7681" font-family="'DM Mono',monospace">HTTP/HTTPS</text>

<!-- FASTAPI SERVER -->
<rect x="60" y="92" width="920" height="72" rx="8" fill="rgba(88,166,255,.1)" stroke="rgba(88,166,255,.35)" stroke-width="1"/>
<text x="520" y="116" text-anchor="middle" font-size="14" font-weight="500" fill="#58a6ff">FastAPI Server — api_with_mfa.py :8000</text>
<text x="520" y="136" text-anchor="middle" font-size="10.5" fill="rgba(88,166,255,.65)" font-family="'DM Mono',monospace">Rate Limiter (slowapi)  ·  CORS Middleware  ·  Static Files  ·  Jinja2 Templates</text>
<text x="520" y="153" text-anchor="middle" font-size="9.5" fill="rgba(88,166,255,.45)" font-family="'DM Mono',monospace">GET /scan/{target}  ·  POST /scan/authenticated  ·  POST /generate-report  ·  GET /dashboard  ·  /auth/*</text>

<!-- Arrow -> auth -->
<line x1="250" y1="164" x2="250" y2="192" stroke="#e3b341" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- AUTH MODULE -->
<rect x="60" y="192" width="380" height="90" rx="7" fill="rgba(227,179,65,.08)" stroke="rgba(227,179,65,.28)" stroke-width=".8"/>
<text x="250" y="213" text-anchor="middle" font-size="12" font-weight="500" fill="#e3b341">Auth Module — auth_mfa.py</text>
<text x="250" y="230" text-anchor="middle" font-size="9.5" fill="rgba(227,179,65,.7)" font-family="'DM Mono',monospace">TOTP/MFA · JWT tokens · Cookie sessions</text>
<text x="250" y="246" text-anchor="middle" font-size="9.5" fill="rgba(227,179,65,.7)" font-family="'DM Mono',monospace">SHA-256 hash · Rate limiting por IP</text>
<text x="250" y="262" text-anchor="middle" font-size="9.5" fill="rgba(227,179,65,.7)" font-family="'DM Mono',monospace">Password recovery via SMTP · Backup codes</text>

<!-- Arrow -> router -->
<line x1="650" y1="164" x2="650" y2="192" stroke="#3fb950" stroke-width="1.4" marker-end="url(#arr)"/>

<!-- UNIVERSAL ROUTER -->
<rect x="460" y="192" width="380" height="90" rx="7" fill="rgba(63,185,80,.07)" stroke="rgba(63,185,80,.25)" stroke-width=".8"/>
<text x="650" y="213" text-anchor="middle" font-size="12" font-weight="500" fill="#3fb950">Universal Router — auditor_universal.py</text>
<text x="650" y="230" text-anchor="middle" font-size="9.5" fill="rgba(63,185,80,.7)" font-family="'DM Mono',monospace">Detecta provider pela URL ou campo provider</text>
<text x="650" y="246" text-anchor="middle" font-size="9.5" fill="rgba(63,185,80,.7)" font-family="'DM Mono',monospace">*.amazonaws.com → AWS S3</text>
<text x="650" y="262" text-anchor="middle" font-size="9.5" fill="rgba(63,185,80,.7)" font-family="'DM Mono',monospace">*.googleapis.com → GCS  ·  *.blob.core.windows.net → Azure</text>

<!-- Arrow router -> public auditors -->
<line x1="530" y1="282" x2="260" y2="330" stroke="#3fb950" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- Arrow router -> auth auditors -->
<line x1="650" y1="282" x2="650" y2="330" stroke="#3fb950" stroke-width="1.2" marker-end="url(#arr)"/>

<!-- PUBLIC AUDITORS -->
<rect x="60" y="330" width="380" height="108" rx="7" fill="rgba(139,148,158,.06)" stroke="rgba(139,148,158,.22)" stroke-width=".8"/>
<text x="250" y="350" text-anchor="middle" font-size="11.5" font-weight="500" fill="#8b949e">Auditors Públicos (até 200 objetos)</text>
<text x="250" y="368" text-anchor="middle" font-size="10" fill="#6e7681" font-family="'DM Mono',monospace">auditor.py          → AWS S3 (HTTP + XML parse)</text>
<text x="250" y="384" text-anchor="middle" font-size="10" fill="#6e7681" font-family="'DM Mono',monospace">auditor_gcs.py      → GCS (XML API)</text>
<text x="250" y="400" text-anchor="middle" font-size="10" fill="#6e7681" font-family="'DM Mono',monospace">auditor_azure.py    → Azure Blob (REST API)</text>
<text x="250" y="420" text-anchor="middle" font-size="9" fill="rgba(139,148,158,.5)" font-family="'DM Mono',monospace">Sem credenciais · requests lib · detecção automática</text>

<!-- AUTHENTICATED AUDITORS -->
<rect x="460" y="330" width="380" height="128" rx="7" fill="rgba(163,113,247,.08)" stroke="rgba(163,113,247,.28)" stroke-width=".8"/>
<text x="650" y="350" text-anchor="middle" font-size="11.5" font-weight="500" fill="#a371f7">Auditors Autenticados (até 1000 objetos)</text>
<text x="650" y="368" text-anchor="middle" font-size="10" fill="rgba(163,113,247,.65)" font-family="'DM Mono',monospace">auditor_s3_authenticated.py     → boto3 SDK</text>
<text x="650" y="384" text-anchor="middle" font-size="10" fill="rgba(163,113,247,.65)" font-family="'DM Mono',monospace">auditor_gcs_authenticated.py    → google-cloud SDK</text>
<text x="650" y="400" text-anchor="middle" font-size="10" fill="rgba(163,113,247,.65)" font-family="'DM Mono',monospace">auditor_azure_authenticated.py  → azure-storage SDK</text>
<text x="650" y="416" text-anchor="middle" font-size="10" fill="rgba(163,113,247,.65)" font-family="'DM Mono',monospace">auditor_k8s_authenticated.py    → kubernetes SDK</text>
<text x="650" y="438" text-anchor="middle" font-size="9" fill="rgba(163,113,247,.45)" font-family="'DM Mono',monospace">AccessKey · ServiceAccount · ConnString · Kubeconfig</text>

<!-- K8s badge -->
<rect x="848" y="330" width="130" height="128" rx="7" fill="rgba(163,113,247,.05)" stroke="rgba(163,113,247,.18)" stroke-width=".6"/>
<text x="913" y="355" text-anchor="middle" font-size="10.5" font-weight="500" fill="#a371f7">K8s Checks</text>
<text x="913" y="372" text-anchor="middle" font-size="9" fill="rgba(163,113,247,.6)" font-family="'DM Mono',monospace">Workload Sec</text>
<text x="913" y="387" text-anchor="middle" font-size="9" fill="rgba(163,113,247,.6)" font-family="'DM Mono',monospace">RBAC</text>
<text x="913" y="402" text-anchor="middle" font-size="9" fill="rgba(163,113,247,.6)" font-family="'DM Mono',monospace">Secrets/ConfigMap</text>
<text x="913" y="417" text-anchor="middle" font-size="9" fill="rgba(163,113,247,.6)" font-family="'DM Mono',monospace">Network Exposure</text>
<text x="913" y="432" text-anchor="middle" font-size="9" fill="rgba(163,113,247,.6)" font-family="'DM Mono',monospace">Anon Auth</text>
<text x="913" y="450" text-anchor="middle" font-size="8" fill="rgba(163,113,247,.4)" font-family="'DM Mono',monospace">EKS · GKE · AKS</text>

<!-- Arrows -> risk engine -->
<line x1="250" y1="438" x2="390" y2="496" stroke="#f85149" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="650" y1="458" x2="530" y2="496" stroke="#f85149" stroke-width="1.3" marker-end="url(#arr)"/>

<!-- RISK ENGINE -->
<rect x="240" y="496" width="560" height="72" rx="7" fill="rgba(248,81,73,.08)" stroke="rgba(248,81,73,.3)" stroke-width=".9"/>
<text x="520" y="516" text-anchor="middle" font-size="12" font-weight="500" fill="#f85149">Risk Engine — engine_risk.py</text>
<text x="520" y="533" text-anchor="middle" font-size="10" fill="rgba(248,81,73,.7)" font-family="'DM Mono',monospace">Severity: CRITICAL · HIGH · MEDIUM · LOW  ·  Score 0–100</text>
<text x="520" y="550" text-anchor="middle" font-size="10" fill="rgba(248,81,73,.65)" font-family="'DM Mono',monospace">Compliance: CIS · PCI-DSS · HIPAA · NIST · ISO 27001  ·  Recommendations</text>

<!-- Arrows risk -> report and -> json -->
<line x1="400" y1="568" x2="290" y2="614" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="640" y1="568" x2="750" y2="614" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arr)"/>

<!-- REPORT GEN -->
<rect x="60" y="614" width="350" height="72" rx="7" fill="rgba(88,166,255,.07)" stroke="rgba(88,166,255,.22)" stroke-width=".8"/>
<text x="235" y="634" text-anchor="middle" font-size="11.5" font-weight="500" fill="#58a6ff">Report Generator — generate_report.py</text>
<text x="235" y="651" text-anchor="middle" font-size="9.5" fill="rgba(88,166,255,.65)" font-family="'DM Mono',monospace">PDF (ReportLab) · DOCX (python-docx)</text>
<text x="235" y="667" text-anchor="middle" font-size="9.5" fill="rgba(88,166,255,.65)" font-family="'DM Mono',monospace">Charts (matplotlib) → reports_executive/</text>

<!-- JSON RESPONSE -->
<rect x="630" y="614" width="350" height="72" rx="7" fill="rgba(139,148,158,.06)" stroke="rgba(139,148,158,.2)" stroke-width=".8"/>
<text x="805" y="634" text-anchor="middle" font-size="11.5" font-weight="500" fill="#8b949e">JSON Response</text>
<text x="805" y="651" text-anchor="middle" font-size="9.5" fill="#6e7681" font-family="'DM Mono',monospace">{ provider, bucket, files[], risk_score,</text>
<text x="805" y="667" text-anchor="middle" font-size="9.5" fill="#6e7681" font-family="'DM Mono',monospace">  severity_dist, recommendations[] }</text>

<!-- DATA STORES (right side) -->
<rect x="858" y="192" width="162" height="130" rx="7" fill="rgba(63,185,80,.05)" stroke="rgba(63,185,80,.18)" stroke-width=".7"/>
<text x="939" y="212" text-anchor="middle" font-size="10.5" font-weight="500" fill="#3fb950">Persistência</text>
<text x="939" y="230" text-anchor="middle" font-size="9.5" fill="rgba(63,185,80,.6)" font-family="'DM Mono',monospace">users_db.json</text>
<text x="939" y="247" text-anchor="middle" font-size="9.5" fill="rgba(63,185,80,.6)" font-family="'DM Mono',monospace">sessions_db.json</text>
<text x="939" y="264" text-anchor="middle" font-size="9.5" fill="rgba(63,185,80,.6)" font-family="'DM Mono',monospace">reports_executive/</text>
<text x="939" y="285" text-anchor="middle" font-size="8.5" fill="rgba(63,185,80,.4)" font-family="'DM Mono',monospace">PDF / DOCX</text>
<text x="939" y="300" text-anchor="middle" font-size="8.5" fill="rgba(63,185,80,.35)" font-family="'DM Mono',monospace">(→ S3 em produção)</text>

<!-- Arrow auth -> persistence -->
<path d="M440 237 L858 237" fill="none" stroke="rgba(63,185,80,.3)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>

</svg>
</div>
</body>
</html>
