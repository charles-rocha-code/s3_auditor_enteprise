<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha - Security Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0e1117 0%, #1a1d29 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1e2139;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            padding: 48px;
            max-width: 440px;
            width: 100%;
        }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo-icon { font-size: 64px; margin-bottom: 16px; }
        h1 { color: #ffffff; font-size: 28px; margin-bottom: 8px; text-align: center; }
        .subtitle { color: #8b92a7; text-align: center; margin-bottom: 32px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label {
            display: block;
            color: #e1e4ea;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #2a2e45;
            border: 2px solid #3a3f5c;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s;
        }
        input:focus { outline: none; border-color: #5b7cff; background: #33384f; }
        input::placeholder { color: #6b7280; }
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #5b7cff 0%, #4c63d9 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 24px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91, 124, 255, 0.4); }
        .back-link {
            text-align: center;
            margin-top: 24px;
            color: #8b92a7;
            font-size: 14px;
        }
        .back-link a {
            color: #5b7cff;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link a:hover { text-decoration: underline; }
        .info-box {
            background: #1e3a8a;
            border-left: 4px solid #3b82f6;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #dbeafe;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon">🛡️</div>
        <h1>Recuperar Senha</h1>
        <p class="subtitle">Security Multicloud Storage Scanner</p>
    </div>

    {% if success %}
<div class="info-box">
    {{ message }}
</div>
{% endif %}

{% if reset_link %}
<div class="info-box" style="margin-top:12px; word-break: break-all;">
    <strong>Link gerado (DEV):</strong><br>
    <a href="{{ reset_link }}" style="color:#dbeafe;">{{ reset_link }}</a>
</div>
{% endif %}

<div class="info-box">
        Informe seu e-mail para receber o link de recuperação.
    </div>

    <form action="/forgot-password" method="post">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="seu@email.com" required />
        </div>

        <button type="submit" class="btn">Enviar link de recuperação</button>
    </form>

    <div class="back-link">
        Voltar para o <a href="/login">Login</a>
    </div>
</div>
</body>
</html>
